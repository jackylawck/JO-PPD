  <script>
    // 初始化雙語介面
    document.addEventListener("DOMContentLoaded", () => setLanguage('zh'));

    const fileInput = document.getElementById('file-input');
    const dropArea = document.getElementById('drop-area');
    const statusPanel = document.getElementById('status-panel');
    const statusText = document.getElementById('status-text');
    const previewBody = document.getElementById('preview-body');
    const downloadBtn = document.getElementById('download-btn');

    let outputWorkbook = null;
    let targetFileName = "Problem.xlsx";

    dropArea.addEventListener('click', () => fileInput.click());
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('bg-blue-50/50'); });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('bg-blue-50/50'));
    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      dropArea.classList.remove('bg-blue-50/50');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      statusPanel.classList.remove('hidden');
      statusText.innerText = i18nData[currentLang].processing;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        processAttendance(workbook, file.name);
      };
      reader.readAsArrayBuffer(file);
    }

    function processAttendance(wb, filename) {
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });

      // 1. 動態識別 Period 檔名與截數截止日
      targetFileName = "Problem.xlsx";
      let cutoffLimitDate = null;
      for (let r = 0; r < Math.min(10, rawData.length); r++) {
        const line = (rawData[r] || []).join(" ");
        const match = line.match(/Period\s*:\s*:?\s*(\d{1,2})[-/](\d{1,2})[-/](\d{4})\s*To\s*(\d{1,2})[-/](\d{1,2})[-/](\d{4})/i);
        if (match) {
          const [, d1, m1, y1, d2, m2, y2] = match;
          targetFileName = `${parseInt(d1)}-${parseInt(d2)}.${parseInt(m2)}.${y2}.Problem.xlsx`;
          cutoffLimitDate = new Date(parseInt(y2), parseInt(m2) - 1, 25);
          break;
        }
      }

      // 2. 定位表頭行
      let headerRow = -1;
      for (let i = 0; i < Math.min(15, rawData.length); i++) {
        if (rawData[i] && rawData[i].some(cell => String(cell).includes("Department Code"))) {
          headerRow = i;
          break;
        }
      }

      if (headerRow === -1) {
        alert(currentLang === 'zh' ? "無法找到 'Department Code' 表頭！" : "Cannot find 'Department Code' header!");
        return;
      }

      const rows = rawData.slice(headerRow + 2);
      const targetDepts = ['PCD', 'HOF', 'PMD', 'POD', 'QSD', 'WMD', 'ADD', 'CPD', 'SED'];
      const problemRows = [];

      rows.forEach(r => {
        const dept = String(r[0] || '').trim().toUpperCase();
        const deptName = String(r[1] || '').trim();
        const empCode = String(r[2] || '').trim().toUpperCase();
        const name = String(r[3] || '').trim();
        const desig = String(r[4] || '').trim();
        
        // 僅審計 E 職員與 9 個目標業務部門
        if (!empCode.startsWith('E') || !targetDepts.includes(dept)) return;

        const dateStr = String(r[5] || '').trim();
        const rowDate = new Date(dateStr);
        if (cutoffLimitDate && !isNaN(rowDate) && rowDate > cutoffLimitDate) return;

        const day = String(r[6] || '').trim();
        const clk1 = parseFloat(r[7]) || 0;
        const clk2 = parseFloat(r[8]) || 0;
        const clk3 = parseFloat(r[9]) || 0;
        const clk4 = parseFloat(r[10]) || 0;
        const timeIn = parseFloat(r[11]) || 0;
        const timeOut = parseFloat(r[12]) || 0;
        const shift = String(r[13] || '').trim().toUpperCase();
        const late = parseFloat(r[15]) || 0;
        const earlyOut = parseFloat(r[16]) || 0;
        const actual = parseFloat(r[17]) || 0;
        const reason = String(r[23] || '').trim().toUpperCase();

        const lastClk = Math.max(clk1, clk2, clk3, clk4);

        // 審計規則過濾
        let isProblem = false;

        // 規則 1: 矛盾缺勤 (有打卡記錄卻記 ABS)
        if (reason === 'ABS' && clk1 > 0) isProblem = true;
        // 規則 2: 漏打下班卡 (上班有卡但離場為 0)
        else if (clk1 > 0 && lastClk === clk1 && timeOut === 0 && shift !== 'REST') isProblem = true;
        // 規則 3: 外勤/特殊任務無實質打卡 (TRAIN/SITE/MEET/EVENT/OTHER)
        else if (clk1 === 0 && lastClk === 0 && ['TRAIN', 'SITE', 'MEET', 'EVENT', 'OTHER'].includes(reason)) isProblem = true;
        // 規則 4: 進出打卡實質脫節 >= 30 分鐘
        else if ((clk1 > 0 && timeIn > 0 && Math.abs(clk1 - timeIn) >= 0.5) || (lastClk > 0 && timeOut > 0 && Math.abs(lastClk - timeOut) >= 0.5 && !reason)) isProblem = true;
        // 規則 5: 無假條工時嚴重流失 (早退 + 遲到 >= 1.5 小時)
        else if ((late + earlyOut >= 1.5) && !reason && shift !== 'REST') isProblem = true;

        if (isProblem) {
          problemRows.push({
            dept, deptName, empCode, name, desig,
            date: dateStr, day, clk1, clk2, clk3, clk4,
            timeIn: (clk1 === 0 && lastClk === 0) ? 0 : timeIn,
            timeOut: (clk1 === 0 && lastClk === 0) ? 0 : timeOut
          });
        }
      });

      window.lastProblemCount = problemRows.length;
      statusText.innerText = i18nData[currentLang].complete.replace('{count}', problemRows.length);

      renderPreview(problemRows);
      buildOutputExcel(problemRows);
    }

    function renderPreview(rows) {
      previewBody.innerHTML = '';
      if (rows.length === 0) {
        previewBody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-slate-400">${i18nData[currentLang].noData}</td></tr>`;
        return;
      }
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="px-3 py-2 border-b font-mono font-medium">${r.dept}</td>
          <td class="px-3 py-2 border-b text-slate-600">${r.deptName}</td>
          <td class="px-3 py-2 border-b font-mono font-bold text-slate-800">${r.empCode}</td>
          <td class="px-3 py-2 border-b font-medium text-slate-900">${r.name}</td>
          <td class="px-3 py-2 border-b">${r.date}</td>
          <td class="px-3 py-2 border-b">${r.day}</td>
          <td class="px-3 py-2 border-b font-mono text-slate-500">${r.clk1} / ${r.clk2} / ${r.clk3} / ${r.clk4}</td>
          <td class="px-3 py-2 border-b font-mono font-bold text-slate-700">${r.timeIn.toFixed(2)}</td>
          <td class="px-3 py-2 border-b font-mono font-bold text-slate-700">${r.timeOut.toFixed(2)}</td>
        `;
        previewBody.appendChild(tr);
      });
    }

    function buildOutputExcel(rows) {
      const header1 = ['Department Code', 'Department Name', 'Emp Code', 'Name', 'Designation', 'Date', 'Day', 'Actual Clocking', '', '', '', 'Time', ''];
      const header2 = ['', '', '', '', '', '', '', '', '', '', '', 'IN', 'OUT'];
      const aoa = [header1, header2];

      rows.forEach(r => {
        aoa.push([
          r.dept, r.deptName, r.empCode, r.name, r.desig,
          r.date, r.day, r.clk1, r.clk2, r.clk3, r.clk4, r.timeIn, r.timeOut
        ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!merges'] = [
        { s: { r: 0, c: 7 }, e: { r: 0, c: 10 } },
        { s: { r: 0, c: 11 }, e: { r: 0, c: 12 } }
      ];

      outputWorkbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(outputWorkbook, ws, "Problem.Log");
    }

    downloadBtn.addEventListener('click', () => {
      if (!outputWorkbook) return;
      XLSX.writeFile(outputWorkbook, targetFileName);
    });
  </script>
