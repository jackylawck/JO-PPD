<body class="bg-gray-100 text-gray-800 min-h-screen py-8 px-4 font-sans">
  <!-- 寬屏自適應容器 (max-w-7xl) -->
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 頂部標題與語系切換 -->
    <header class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">

        <div class="flex flex-wrap items-center gap-3">

          <span id="ui-privacy-badge" class="bg-green-50 text-green-700 text-xs px-2.5 py-1 rounded-full border border-green-200 font-medium">
            純前端離線解析・零數據外流風險
          </span>
        </div>
        <p id="ui-subtitle" class="text-sm text-gray-500 mt-1">Jumbo Orient Punch Problem Detector (JO-PPD)</p>
      </div>
      <button onclick="toggleLanguage()" id="ui-lang-btn" class="self-start md:self-auto bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-2 rounded-lg border border-gray-300 transition">
        English
      </button>
    </header>

      <summary class="cursor-pointer font-semibold text-gray-800 flex justify-between items-center select-none">
        <span id="ui-guide-title" class="text-base font-bold text-gray-900 flex items-center gap-2">
          📖 系統說明與操作指引
        </span>
        <span class="text-xs text-gray-400 group-open:rotate-180 transition-transform">▼</span>
      </summary>
      <div class="mt-4 pt-4 border-t border-gray-100 text-sm text-gray-600 space-y-4">
        <p id="ui-guide-intro" class="leading-relaxed"></p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
          <div>
            <h4 id="ui-guide-step-title" class="font-bold text-gray-800 mb-2"></h4>
            <ol id="ui-guide-steps" class="list-decimal list-inside space-y-1.5 text-xs text-gray-600 leading-relaxed"></ol>
          </div>
          <div>
            <h4 id="ui-guide-rules-title" class="font-bold text-gray-800 mb-2"></h4>
            <ul id="ui-guide-rules" class="list-disc list-inside space-y-1.5 text-xs text-gray-600 leading-relaxed"></ul>
          </div>
        </div>
      </div>
    </details>

    <!-- 檔案上傳區塊 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <div id="drop-area" class="border-2 border-dashed border-gray-300 hover:border-blue-400 rounded-xl p-10 text-center cursor-pointer hover:bg-blue-50 transition">
        <input type="file" id="file-input" accept=".xls,.xlsx" class="hidden">
        <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <h3 id="ui-drop-title" class="text-base font-bold text-gray-800"></h3>
        <p id="ui-drop-subtitle" class="text-xs text-gray-500 mt-1"></p>
        <p id="ui-drop-notice" class="text-xs text-green-600 font-medium mt-3"></p>
      </div>

      <!-- 解析結果面板 (擴充至全頁視覺) -->
      <div id="status-panel" class="mt-8 hidden space-y-4">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
            <span id="status-text" class="text-sm font-semibold text-gray-800"></span>
          </div>
          <button id="download-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg shadow-sm transition">
            下載 Problem.xlsx 報表
          </button>
        </div>

        <!-- 快速分類標籤 -->
        <div class="flex flex-wrap items-center gap-2 pt-2">
          <button onclick="applyFilter('ALL')" id="tab-all" class="filter-tab active bg-gray-900 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition shadow-sm">
            全部異常
          </button>
          <button onclick="applyFilter('MISSED')" id="tab-missed" class="filter-tab bg-yellow-50 hover:bg-yellow-100 text-yellow-700 border border-yellow-200 text-xs font-semibold px-3.5 py-2 rounded-lg transition">
            ⚠️ 漏打卡 (Missed Checkout)
          </button>
          <button onclick="applyFilter('ABS')" id="tab-abs" class="filter-tab bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-semibold px-3.5 py-2 rounded-lg transition">
            🚨 全天缺勤 (ABS)
          </button>
          <button onclick="applyFilter('LATE')" id="tab-late" class="filter-tab bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-semibold px-3.5 py-2 rounded-lg transition">
            遲過 9:00
          </button>
          <button onclick="applyFilter('EARLY')" id="tab-early" class="filter-tab bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 text-xs font-semibold px-3.5 py-2 rounded-lg transition">
            早過 17:30
          </button>
        </div>

        <!-- 即時預覽表格 (加長至 min-h-[600px] 大視窗) -->
        <div class="border border-gray-200 rounded-xl overflow-hidden min-h-[600px] max-h-[85vh] overflow-y-auto shadow-inner bg-white">
          <table class="w-full text-xs text-left divide-y divide-gray-200">
            <thead class="bg-gray-50 text-gray-700 font-bold sticky top-0 shadow-sm z-10">
              <tr>
                <th id="th-dept" class="px-3.5 py-3">部門代碼</th>
                <th id="th-dept-name" class="px-3.5 py-3">部門名稱</th>
                <th id="th-emp" class="px-3.5 py-3">工號</th>
                <th id="th-name" class="px-3.5 py-3">姓名</th>
                <th id="th-date" class="px-3.5 py-3">日期</th>
                <th id="th-day" class="px-3.5 py-3">星期</th>
                <th id="th-clk" class="px-3.5 py-3">原始打卡 (Clk1-4)</th>
                <th id="th-in" class="px-3.5 py-3">Time IN</th>
                <th id="th-out" class="px-3.5 py-3">Time OUT</th>
                <th id="th-reason" class="px-3.5 py-3">異常原因 (Reason)</th>
              </tr>
            </thead>
            <tbody id="preview-body" class="divide-y divide-gray-100 bg-white"></tbody>
          </table>
        </div>
      </div>
